# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

############################
# --- Required options --- #
############################

# Name of website
title: Personal Website | PACE Lab

# Your name to show in the footer
author: Jeremy W. Hopwood

###############################################
# --- List of links in the navigation bar --- #
###############################################

navbar-links:
  About Me: "about"
  Capabilities: "capabilities"
  Research:
    - Nonlinear Observers: "observers"
    - Wind Estimation: "wind_estimation"
    - System ID: "system_id"
  Publications: "publications"
  Teaching: "teaching"

################
# --- Logo --- #
################

# Image to show in the navigation bar - works best with a square image
# Remove this parameter if you don't want an image in the navbar
# avatar: "/assets/img/headshot_square.jpeg"
avatar: "/assets/img/logo.png"

# By default, the image is cut into a circle. You can disable this behaviour by setting 'round-avatar: false'
round-avatar: true

# If you want to have an image logo in the top-left corner instead of having the title of the website,
# then specify the following parameter
#title-img: /path/to/image

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
email: jhopwood@ae.msstate.edu
description: >- # this means to ignore newlines until "baseurl:"
  Personal website of Jeremy W. Hopwood, Ph.D.
baseurl: "/" # the subpath of your site, e.g. /blog
url: "https://hopwoodlab.com" # the base hostname & protocol for your site, e.g. http://example.com
github_username: jwhgit01

# Build settings
markdown: kramdown
remote_theme: daattali/beautiful-jekyll@6.0.1
plugins:
  - jekyll-feed
  - jekyll-scholar
  - jekyll-remote-theme

# Jekyll-Scholar configuration, https://github.com/inukshuk/jekyll-scholar
scholar:
  style: ./_bibliography/ieee-no-numbers.csl
  order: descending
  group_order: ascending,descending
  sort_by: year,month
  group_by: type,year
  type_order: [article,inproceedings,misc,thesis]
  type_names: { article: Journal Articles, inproceedings: Conference Proceedings, misc: Seminars, thesis: Dissertation}
  bibliography_template: bib

# The keywords to associate with your website, for SEO purposes
keywords: "PACE lab,nonlinear control,flight dynamics,flight controls,estimation,system identification"

#####################################
# --- Colors / background image --- #
#####################################

# Personalize the colors in your website. color values can be any valid CSS color
page-col: "#ffffff"
text-col: "#333333" # "#023047"
link-col: "#fb8500"
hover-col: "#FFB81C" # "#219ebc"
navbar-col: "#5d1725" # "#8ecae6"
navbar-text-col: "#ffffff" # "#023047"
navbar-border-col: "#C1C6C8" # "#8ecae6"
footer-col: "#5d1725" # "#8ecae6"
footer-text-col: "#ffffff" # "#023047"
footer-link-col: "#ffffff" # "#023047"
footer-hover-col: "#FFB81C" # "#219ebc"

# Alternatively, the navbar, footer, and page background can be set to an image
# instead of color

#navbar-img: "/assets/img/bgimage.png"
#footer-img: "/assets/img/bgimage.png"
#page-img: "/assets/img/bgimage.png"

# Suggest a color for mobile browsers to use as the browser's theme. This is only supported by a few mobile browsers.
#mobile-theme-col: "#0085A1"

site-css:
  - "/assets/css/publications.css"

# If you have common JavaScript files that should be included in every page, list them here
#site-js:
#  - "/assets/js/custom-script.js"

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
