<head>
  <style>
    .container {
      display: flex;
      align-items: flex-start; /* Ensures both divs are aligned at the top */
    }
    .pub-img {
      flex-shrink: 0; /* Prevents shrinking of the image container */
    }
    .pub-img img {
      width: 200px; /* Set the fixed width for the image */
      height: auto; /* Maintain the aspect ratio */
    }
    .publication-details {
      flex-grow: 1; /* Allows this div to take up the remaining space */
      padding-left: 20px; /* Optional: Add some space between image and details */
    }
    ol.bibliography {
      list-style: none;
      padding: 0;
    }
    ol.bibliography li {
      margin-bottom: 20px; /* Adjust this value for desired spacing */
    }
    .collapse-container {
      display: flex;
      margin-top: 10px;
    }
    .button {
      padding: 5px 10px;
      background-color: #fb8500;
      color: white;
      border: none;
      cursor: pointer;
      margin-right: 5px;
      text-decoration: none;
      border-radius: 5px;
    }
    .button:hover {
      background-color: #ffb703;
    }
    .collapsible-content {
      display: none; /* Hidden by default */
      padding-left: 10px;
      padding-right: 10px;
      background-color: #f8f9fa;
      /* border-left: 3px solid #ccc; */
      max-height: 200px; /* Set the max height */
      overflow: auto; /* Enable scrolling */
      width: 100%; /* Ensure the collapsible sections take up full width */
    }
    pre {
      /* background-color: #ebebeb; */
      border: none;
      padding: none;
      white-space: pre-wrap; /* Preserve whitespace but allow wrapping */
      word-break: break-word; /* Ensure words break as necessary */
    }
  </style>
</head>

<div class="container">
  <div class="pub-img">
    <img src="../assets/img/{{ entry.key }}.png" alt="">
  </div>
  <div class="publication-details">

    <!-- Bib item -->
    {{ reference }}
    
    <!-- Links Section (Buttons) -->
    <div class="links" style="margin-top: 10px;">
      <!-- Abstract Button (only show if there is an abstract) -->
      {% if entry.abstract %}
        <a class="abstract button tiny radius" role="button" onclick="toggleExclusive('{{ entry.key }}_abstract', '{{ entry.key }}')">Abstract</a>
      {% endif %}
  
      <!-- Link Button (only show if the link exists) -->
      {% if entry.doi %}
        <a href="https://doi.org/{{ entry.doi }}" class="button tiny radius" role="button" target="_blank">🔗</a>
      {% endif %}
  
      <!-- BibTeX Button -->
      <a class="bibtex button tiny radius" role="button" onclick="toggleExclusive('{{ entry.key }}_bibtex', '{{ entry.key }}')">Bib</a>
    </div>
    
    <!-- Collapsible Content Section (Below Buttons) -->
    <div class="collapse-container">
      <!-- Collapsible Abstract Section -->
      {% if entry.abstract %}
      <div id="{{ entry.key }}_abstract" class="collapsible-content">
        <p style="margin: 5px">{{ entry.abstract }}</p>
      </div>
      {% endif %}
  
      <!-- Collapsible BibTeX Section -->
      <div id="{{ entry.key }}_bibtex" class="collapsible-content">
        <pre>{{ entry.bibtex }}</pre>
      </div>
    </div>

  </div>
</div>

<script>
  function toggleExclusive(sectionId, entryKey) {
    // Get the abstract and bibtex elements
    var abstract = document.getElementById(entryKey + '_abstract');
    var bibtex = document.getElementById(entryKey + '_bibtex');
    
    // Get the selected section
    var selected = document.getElementById(sectionId);
    
    // If the selected section is open, close it
    if (selected && selected.style.display === "block") {
      selected.style.display = "none";
    } else {
      // Otherwise, hide both and show the selected one
      if (abstract) abstract.style.display = 'none';
      if (bibtex) bibtex.style.display = 'none';
      
      // Show the selected section
      if (selected) selected.style.display = 'block';
    }
  }
</script>
